name: alphafold-explorer

# DuckDB is a file, not a service: it is bind-mounted into every container that needs
# it. It also takes a per-process write lock, so only one of api / ingest / annotate /
# embed may run at a time. The `tools` profile exists so the one-shot jobs are not
# started alongside the API by accident.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AFX_S3_ACCESS_KEY:-afxadmin}
      MINIO_ROOT_PASSWORD: ${AFX_S3_SECRET_KEY:-afxadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set afx http://minio:9000 ${AFX_S3_ACCESS_KEY:-afxadmin} ${AFX_S3_SECRET_KEY:-afxadmin123} &&
        mc mb --ignore-existing afx/${AFX_S3_BUCKET:-afx-structures} &&
        echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AFX_DB_PATH: /data/afdb.duckdb
      AFX_S3_ENDPOINT: http://minio:9000
      AFX_S3_BUCKET: ${AFX_S3_BUCKET:-afx-structures}
      AFX_S3_ACCESS_KEY: ${AFX_S3_ACCESS_KEY:-afxadmin}
      AFX_S3_SECRET_KEY: ${AFX_S3_SECRET_KEY:-afxadmin123}
      # Reaches the Ollama already installed on the host, so the 4.9 GB model is not
      # downloaded twice. Start the bundled one instead with --profile ollama.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AFX_CHAT_MODEL: ${AFX_CHAT_MODEL:-llama3.1:8b}
      AFX_EMBED_MODEL: ${AFX_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    environment:
      AFX_API_URL: http://api:3000
    ports:
      - "5173:5173"

  # One-shot jobs. Run with:  docker compose --profile tools run --rm ingest
  ingest:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "ingest", "-w", "@afx/ingest"]
    environment:
      AFX_DB_PATH: /data/afdb.duckdb
      AFX_CACHE_DIR: /data/cache
      AFX_S3_ENDPOINT: http://minio:9000
      AFX_S3_BUCKET: ${AFX_S3_BUCKET:-afx-structures}
      AFX_S3_ACCESS_KEY: ${AFX_S3_ACCESS_KEY:-afxadmin}
      AFX_S3_SECRET_KEY: ${AFX_S3_SECRET_KEY:-afxadmin123}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data

  annotate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "annotate", "-w", "@afx/ingest"]
    environment:
      AFX_DB_PATH: /data/afdb.duckdb
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AFX_CHAT_MODEL: ${AFX_CHAT_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data

  embed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "embed", "-w", "@afx/ingest"]
    environment:
      AFX_DB_PATH: /data/afdb.duckdb
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AFX_EMBED_MODEL: ${AFX_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data

  # Only for machines with no host Ollama:  docker compose --profile ollama up -d ollama
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.6.8
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  minio-data:
  ollama-models:
